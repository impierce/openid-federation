[package]
name = "openid-federation-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "cargo-fuzz targets for openid-federation: `cargo fuzz run <target>` from this directory"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
jsonwebtoken = "9.0"
libfuzzer-sys = "0.4"
openid-federation = { path = ".." }
serde = "1.0"
# `float_roundtrip`: the targets assert that whatever parses survives a round trip through JSON.
# Without it, `serde_json` parses floats with a fast algorithm that is not correctly rounded, so a
# long numeric literal in an unknown claim can change on the second parse; a property of
# `serde_json`, not of this crate. Cargo unifies the feature into the library's `serde_json` for
# the fuzz build only.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
url = "2.4"

# Every binary is a fuzz target; the Fuzz workflow discovers them from this manifest.

[[bin]]
name = "entity_statement"
path = "fuzz_targets/entity_statement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwt"
path = "fuzz_targets/jwt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trust_mark"
path = "fuzz_targets/trust_mark.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwk"
path = "fuzz_targets/jwk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "entity_id"
path = "fuzz_targets/entity_id.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

# A workspace of its own: the fuzz targets build on nightly with sanitizers and never join
# the library's build.
[workspace]
