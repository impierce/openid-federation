# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# `advisories` runs in the Audit workflow; `licenses`, `bans` and `sources` run in the License workflow.

[graph]
all-features = true

[advisories]
# Also fail on unmaintained crates anywhere in the graph and on yanked versions.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing this crate under Apache-2.0.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla root store data (`webpki-root-certs`), a permissive data license.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Keep the list above as policy, even for licenses no dependency currently uses.
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
