[package]
name = "openid-federation"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of the OpenID Federation 1.0 standard"
repository = "https://github.com/impierce/openid-federation"
license = "Apache-2.0"
keywords = ["openid", "federation", "identity", "oauth", "authentication"]
categories = ["authentication", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.0"
url = { version = "2.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
tokio = { version = "1.0", features = ["full"] }
base64 = "0.21"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"
