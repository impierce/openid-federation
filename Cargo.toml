[package]
name = "openid-federation"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
description = "A Rust implementation of the OpenID Federation 1.0 standard"
repository = "https://github.com/impierce/openid-federation"
license = "Apache-2.0"
keywords = ["openid", "federation", "identity", "oauth", "authentication"]
categories = ["authentication", "web-programming"]
include = ["/src", "/CHANGELOG.md", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
# No crypto backend: `jsonwebtoken` 11 panics when it finds both or neither, so the application picks exactly one.
jsonwebtoken = { version = "11.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
# The tests sign and verify, so they enable a backend; it shares the crypto library that reqwest's `rustls` pulls in.
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
tokio-test = "0.4"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
